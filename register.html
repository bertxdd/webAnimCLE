<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join SeaGuard</title><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/animations.css"><link rel="stylesheet" href="assets/css/components.css"></head>
<body><header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">◒</span> SEAGUARD</a><a class="btn btn-ghost btn-small" href="login.html">Log in</a></nav></header>
<main class="page-shell center-page"><section class="glass-card form-card"><div class="eyebrow">Become a guardian</div><h1>Join the current.</h1><p class="form-note">Create your free field account and make your impact visible.</p><form data-validated-form><div class="form-group"><label for="name">Full name</label><input id="name" type="text" placeholder="Alex Rivera" required minlength="2"><span class="form-error"></span></div><div class="form-group"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required><span class="form-error"></span></div><div class="form-group"><label for="password">Create password</label><input id="password" type="password" placeholder="8+ characters" required minlength="8"><div class="password-meter"><span></span></div><span class="form-error"></span></div><button class="btn" type="submit" style="width:100%">Create my account →</button></form><div class="form-footer">Already a guardian? <a href="login.html" style="color:var(--cyan-300)">Log in</a></div></section></main><div id="pledge-modal" class="modal-backdrop"><div class="modal glass-card"><div class="eyebrow">Your pledge</div><h2>Welcome to the crew.</h2><p class="muted">By joining SeaGuard, you pledge to protect marine life, reduce plastic use, and share the progress your community makes.</p><button class="btn" data-modal-close data-redirect="dashboard.html">Accept and enter dashboard →</button></div></div><script src="assets/js/validation.js"></script><script src="assets/js/app.js"></script></body></html>
