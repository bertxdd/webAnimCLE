    <header class="site-header">
      <nav class="nav container">
        <a class="brand" href="index.html"
          ><img class="brand-logo" src="assets/images/graphics/logo/ASAVE.png" alt="AquaSave" width="152" height="94" /></a

      </nav>
    </header>
    <main class="page-shell center-page">
      <section class="glass-card form-card">
        <svg class="emblem" viewBox="0 0 64 72" aria-hidden="true">
          <path
            class="e-shield"
            d="M32 4 56 14v20c0 17-10 29-24 34C18 63 8 51 8 34V14Z"
          />
          <path class="e-check" d="m21 36 8 8 15-17" />
        </svg>
        <div class="eyebrow">Secure field access</div>
        <h1>Welcome back.</h1>
        <p class="form-note">
          Continue coordinating the work beneath the surface.
        </p>
        <form data-demo-submit>
          <div class="form-group">
            <label for="email">Email address</label
            ><input
              id="email"
              type="email"
              placeholder="you@aquasave.org"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label
            ><input
              id="password"
              type="password"
              placeholder="••••••••"
              required
            />
          </div>
          <button class="btn" type="submit" style="width: 100%">
            Continue to dashboard →
          </button>
        </form>
        <div class="badge-row">
          <span class="seal"
            ><svg viewBox="0 0 24 24" class="icon">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            Encrypted marine data access</span
          >
        </div>
        <div class="form-footer">
          New to the mission?
          <a href="register.html" style="color: var(--cyan-300)"
            >Join AquaSave</a
          >
        </div>
      </section>
